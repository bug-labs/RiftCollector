# Upgrades menu. Same options as gui/collector.yml, with one extra section: 'upgrades' says
# which slot each upgrade sits in and which item to draw for it.
#
# Placeholders in an upgrade's item, on top of the ones every menu has:
#   <upgrade> <level> <max-level> <value> <next-value> <cost> <reason>
# The storage upgrade has its own set instead:
#   <level> <max-level> <pages> <page-size> <bulk> <cost-one> <cost-bulk> <cost-page>

title: "<lang:gui.upgrades.title>"
rows: 5

content-character: "#"
layout:
  - "DDDDDDDDD"
  - "D       D"
  - "D       D"
  - "D       D"
  - "DDDDBDDDD"

# slot        where the upgrade is drawn, 0 is the top left corner
# icon        item shown while the upgrade can still be bought
# maxed-icon  item shown once it is at its last level
# locked-icon item shown when the player may not buy it
# page-icon   storage only: used instead of 'icon' when upgrades.slots.mode is PAGE, where a
#             whole page is bought at a time and the per-slot clicks do not apply
# Each of those names an entry under 'items' below.
upgrades:
  pickup-speed:
    slot: 11
    icon: A
    maxed-icon: AM
    locked-icon: L
  pickup-range:
    slot: 12
    icon: R
    maxed-icon: RM
    locked-icon: L
  slots:
    slot: 14
    icon: S
    page-icon: SP
    maxed-icon: SM
    locked-icon: L
  slot-capacity:
    slot: 15
    icon: C
    maxed-icon: CM
    locked-icon: L

items:
  D:
    material: GRAY_STAINED_GLASS_PANE
    hide-tooltip: true

  B:
    material: ARROW
    name: "<lang:gui.back.name>"
    lore:
      - "<lang:gui.back.lore>"
    action: back

  A:
    material: SUGAR
    name: "<lang:upgrade.pickup-speed.name>"
    lore:
      - "<lang:gui.upgrades.pickup-speed.lore-1>"
      - "<lang:gui.upgrades.pickup-speed.lore-2>"
      - ""
      - "<lang:gui.upgrades.level>"
      - "<lang:gui.upgrades.current>"
      - "<lang:gui.upgrades.next>"
      - ""
      - "<lang:gui.upgrades.buy>"
  AM:
    material: SUGAR
    glow: true
    name: "<lang:upgrade.pickup-speed.name>"
    lore:
      - "<lang:gui.upgrades.pickup-speed.lore-1>"
      - "<lang:gui.upgrades.pickup-speed.lore-2>"
      - ""
      - "<lang:gui.upgrades.level>"
      - "<lang:gui.upgrades.current>"
      - "<lang:gui.upgrades.maxed>"

  R:
    material: SPYGLASS
    name: "<lang:upgrade.pickup-range.name>"
    lore:
      - "<lang:gui.upgrades.pickup-range.lore-1>"
      - "<lang:gui.upgrades.pickup-range.lore-2>"
      - ""
      - "<lang:gui.upgrades.level>"
      - "<lang:gui.upgrades.current>"
      - "<lang:gui.upgrades.next>"
      - ""
      - "<lang:gui.upgrades.buy>"
  RM:
    material: SPYGLASS
    glow: true
    name: "<lang:upgrade.pickup-range.name>"
    lore:
      - "<lang:gui.upgrades.pickup-range.lore-1>"
      - "<lang:gui.upgrades.pickup-range.lore-2>"
      - ""
      - "<lang:gui.upgrades.level>"
      - "<lang:gui.upgrades.current>"
      - "<lang:gui.upgrades.maxed>"

  S:
    material: CHEST
    name: "<lang:upgrade.slots.name>"
    lore:
      - "<lang:gui.upgrades.slots.lore-1>"
      - "<lang:gui.upgrades.slots.lore-2>"
      - ""
      - "<lang:gui.upgrades.slots.unlocked>"
      - "<lang:gui.upgrades.slots.pages>"
      - ""
      - "<lang:gui.upgrades.slots.buy-one>"
      - "<lang:gui.upgrades.slots.buy-bulk>"
      - "<lang:gui.upgrades.slots.buy-page>"
  SP:
    material: CHEST
    name: "<lang:upgrade.slots.name>"
    lore:
