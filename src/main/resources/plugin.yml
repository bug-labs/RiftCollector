name: RiftCollector
version: '${version}'

main: me.iamsamarth.riftcollector.RiftCollector
api-version: '1.21.11'
load: POSTWORLD

authors: [ Samarth Sharma ]

# Plugin names as they appear in their own plugin.yml, which is not always the name on the
# download page: ShopGUI+ calls itself ShopGUIPlus.
softdepend: [ PlaceholderAPI, Vault, ExcellentEconomy, CoinsEngine, ShopGUIPlus, EconomyShopGUI,
              EconomyShopGUI-Premium, zItemStacker ]

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.mysql:mysql-connector-j:9.1.0

commands:
  collector:
    description: Get a collector item or reload the configuration.
    usage: /collector [give <player> [amount]|reload]
    # No permission here on purpose: each subcommand checks its own, so riftcollector.reload
    # alone is enough to reload without also granting riftcollector.give.

permissions:
  riftcollector.give:
    description: Allows getting collector items.
    default: op
  riftcollector.reload:
    description: Allows reloading the configuration.
    default: op
  riftcollector.place:
    description: Allows placing collectors.
    default: true
  riftcollector.bypass:
    description: Allows opening and breaking collectors owned by someone else.
    default: op
  riftcollector.upgrade.*:
    description: Allows buying every upgrade.
    default: true
    children:
      riftcollector.upgrade.pickup-speed: true
      riftcollector.upgrade.pickup-range: true
      riftcollector.upgrade.slots: true
      riftcollector.upgrade.slot-capacity: true
  riftcollector.upgrade.pickup-speed:
    description: Allows buying the pickup speed upgrade.
    default: true
  riftcollector.upgrade.pickup-range:
    description: Allows buying the pickup range upgrade.
    default: true
  riftcollector.upgrade.slots:
    description: Allows buying the slots upgrade.
    default: true
  riftcollector.upgrade.slot-capacity:
    description: Allows buying the slot capacity upgrade.
    default: true
  riftcollector.ability.*:
    description: Allows using every collector ability.
    default: true
    children:
      riftcollector.ability.auto-sell: true
      riftcollector.ability.auto-smelt: true
      riftcollector.ability.hologram: true
  riftcollector.ability.auto-sell:
    description: Allows switching auto sell on.
    default: true
  riftcollector.ability.auto-smelt:
    description: Allows switching auto smelt on.
    default: true
  riftcollector.ability.hologram:
    description: Allows showing or hiding a collector's hologram.
    default: true
  riftcollector.sell:
    description: Allows selling a collector's contents from its menu.
    default: true
  riftcollector.rename:
    description: Allows naming a collector from its Settings menu.
    default: true
  riftcollector.update-notify:
    description: Tells this player on join when a plugin update is available.
    default: op
